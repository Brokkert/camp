name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          # smoke.mjs gebruikt playwright, maar CI draait alleen vitest — geen
          # reden om bij elke build een browser van honderd MB op te halen.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm test
      - run: npm run build
      # Let op: "enablement: true" kan Pages niet zelf aanzetten als dat nog nooit
      # gebeurd is — het standaard GITHUB_TOKEN mag geen Pages-site aanmaken en
      # de stap faalt dan met "Resource not accessible by integration".
      #
      # Eenmalig met de hand: Settings -> Pages -> Build and deployment ->
      # Source op "GitHub Actions". Daarna werkt deze stap gewoon en hoef je er
      # nooit meer naar om te kijken.
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
